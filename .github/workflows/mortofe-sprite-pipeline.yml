name: Mortofe production sprite pipeline

on:
  push:
    paths:
      - 'Mortofe/art/**'
      - '.github/workflows/mortofe-sprite-pipeline.yml'
  pull_request:
    paths:
      - 'Mortofe/art/**'
      - '.github/workflows/mortofe-sprite-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-sprite-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record source and checked-in derivative hashes
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(sha256sum Mortofe/art/master/player/player_master_v1.png | awk '{print $1}')"
          DERIVATIVE_SHA="$(sha256sum Mortofe/art/normalized/player/player_idle_prod_v1.png | awk '{print $1}')"
          echo "MORTOFE_MASTER_SHA256=${SOURCE_SHA}"
          echo "MORTOFE_DERIVATIVE_SHA256=${DERIVATIVE_SHA}"
          echo "MORTOFE_MASTER_SHA256=${SOURCE_SHA}" >> "$GITHUB_ENV"
          echo "MORTOFE_DERIVATIVE_SHA256=${DERIVATIVE_SHA}" >> "$GITHUB_ENV"

      - name: Fetch pinned ARCONT production sprite tools
        shell: bash
        run: |
          set -euo pipefail
          ARCONT_COMMIT='3dd31bd962999f36de264c5bb364f41624ca7f0b'
          curl -L --fail --retry 3 \
            -o /tmp/png_sprite_normalize.py \
            "https://raw.githubusercontent.com/heliossamuelhernandezreyes/Arcont/${ARCONT_COMMIT}/tools/png_sprite_normalize.py"
          curl -L --fail --retry 3 \
            -o /tmp/png_sprite_audit.py \
            "https://raw.githubusercontent.com/heliossamuelhernandezreyes/Arcont/${ARCONT_COMMIT}/tools/png_sprite_audit.py"
          python /tmp/png_sprite_normalize.py --help >/dev/null
          python /tmp/png_sprite_audit.py --help >/dev/null

      - name: Regenerate normalized player deterministically
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/png_sprite_normalize.py \
            Mortofe/art/normalization_plan.json \
            --project-root Mortofe \
            --report /tmp/mortofe-normalization-report.json
          AFTER_SHA="$(sha256sum Mortofe/art/normalized/player/player_idle_prod_v1.png | awk '{print $1}')"
          echo "MORTOFE_REGENERATED_SHA256=${AFTER_SHA}"
          test "$AFTER_SHA" = "$MORTOFE_DERIVATIVE_SHA256"
          git diff --exit-code -- Mortofe/art/normalized/player/player_idle_prod_v1.png
          cat /tmp/mortofe-normalization-report.json

      - name: Audit normalized production frame
        shell: bash
        run: |
          set -euo pipefail
          python /tmp/png_sprite_audit.py \
            Mortofe/art/production_sprite_manifest.json \
            --project-root Mortofe | tee /tmp/mortofe-sprite-audit.json

      - name: Upload production sprite reports
        uses: actions/upload-artifact@v4
        with:
          name: Mortofe-production-sprite-reports
          path: |
            /tmp/mortofe-normalization-report.json
            /tmp/mortofe-sprite-audit.json
          if-no-files-found: error
          retention-days: 14
