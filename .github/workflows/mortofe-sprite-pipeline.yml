name: Mortofe production sprite pipeline

on:
  push:
    paths:
      - 'Mortofe/art/**'
      - 'Mortofe/tools/build_player_master.py'
      - 'Mortofe/tools/build_player_readability_poses.py'
      - 'Mortofe/tools/prepare_production_art.py'
      - 'Mortofe/tools/validate_player_pose_gate.py'
      - '.github/workflows/mortofe-sprite-pipeline.yml'
  pull_request:
    paths:
      - 'Mortofe/art/**'
      - 'Mortofe/tools/build_player_master.py'
      - 'Mortofe/tools/build_player_readability_poses.py'
      - 'Mortofe/tools/prepare_production_art.py'
      - 'Mortofe/tools/validate_player_pose_gate.py'
      - '.github/workflows/mortofe-sprite-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-sprite-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare and audit production player
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/mortofe-sprite-reports
          python Mortofe/tools/prepare_production_art.py \
            --project-root Mortofe \
            --audit \
            --report-dir /tmp/mortofe-sprite-reports

          test -s Mortofe/art/master/player/player_master_v1.png
          test -s Mortofe/art/master/player/player_run_master_v1.png
          test -s Mortofe/art/master/player/player_attack_master_v1.png
          test -s Mortofe/art/normalized/player/player_idle_prod_v1.png
          test -s Mortofe/art/normalized/player/player_run_prod_v1.png
          test -s Mortofe/art/normalized/player/player_attack_prod_v1.png
          test -s /tmp/mortofe-sprite-reports/player_pose_gate.json

          sha256sum \
            Mortofe/art/master/player/player_master_v1.png \
            Mortofe/art/master/player/player_run_master_v1.png \
            Mortofe/art/master/player/player_attack_master_v1.png \
            Mortofe/art/normalized/player/player_idle_prod_v1.png \
            Mortofe/art/normalized/player/player_run_prod_v1.png \
            Mortofe/art/normalized/player/player_attack_prod_v1.png \
            > /tmp/mortofe-sprite-reports/hashes-first.txt

          # Consumer-level determinism check: rebuilding from the same recipes and
          # pinned ARCONT commit must produce byte-identical masters and derivatives.
          python Mortofe/tools/prepare_production_art.py \
            --project-root Mortofe \
            --audit \
            --report-dir /tmp/mortofe-sprite-reports/repeat

          sha256sum \
            Mortofe/art/master/player/player_master_v1.png \
            Mortofe/art/master/player/player_run_master_v1.png \
            Mortofe/art/master/player/player_attack_master_v1.png \
            Mortofe/art/normalized/player/player_idle_prod_v1.png \
            Mortofe/art/normalized/player/player_run_prod_v1.png \
            Mortofe/art/normalized/player/player_attack_prod_v1.png \
            > /tmp/mortofe-sprite-reports/hashes-second.txt
          diff -u /tmp/mortofe-sprite-reports/hashes-first.txt /tmp/mortofe-sprite-reports/hashes-second.txt
          echo "deterministic=true" | tee /tmp/mortofe-sprite-reports/determinism.txt

      - name: Upload production sprite reports
        uses: actions/upload-artifact@v4
        with:
          name: Mortofe-production-sprite-reports
          path: /tmp/mortofe-sprite-reports/**
          if-no-files-found: error
          retention-days: 14
