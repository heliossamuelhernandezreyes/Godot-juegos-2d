name: Mortofe Godot validation

on:
  push:
    paths:
      - 'Mortofe/**'
      - '.github/workflows/mortofe-godot-validate.yml'
  pull_request:
    paths:
      - 'Mortofe/**'
      - '.github/workflows/mortofe-godot-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare production art with pinned ARCONT pipeline
        shell: bash
        run: |
          set -euo pipefail
          python3 Mortofe/tools/prepare_production_art.py \
            --project-root Mortofe \
            --audit \
            --report-dir /tmp/mortofe-production-art
          test -s Mortofe/art/master/player/player_master_v1.png
          test -s Mortofe/art/normalized/player/player_idle_prod_v1.png

      - name: Audit legacy prototype sprites with pinned ARCONT tool
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o sprite_audit.py \
            https://raw.githubusercontent.com/heliossamuelhernandezreyes/Arcont/c5c0ce20c5ee2e99b6d0a6fba11cd34c282ecc01/tools/sprite_audit.py
          python3 sprite_audit.py Mortofe/art/sprite_manifest.json --project-root Mortofe

      - name: Fetch pinned Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip' | sha256sum -c -
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot
          ./godot --version

      - name: Import and parse project
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path Mortofe --editor --quit

      - name: Smoke run
        shell: bash
        run: |
          set -euo pipefail
          ./godot --headless --path Mortofe --quit-after 5

      - name: Fetch pinned Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o export_templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  export_templates.tpz' | sha256sum -c -
          rm -rf export_templates_unpacked
          mkdir -p export_templates_unpacked
          unzip -q export_templates.tpz -d export_templates_unpacked
          template_dir="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$template_dir"
          if [ -d export_templates_unpacked/templates ]; then
            cp -a export_templates_unpacked/templates/. "$template_dir/"
          else
            cp -a export_templates_unpacked/. "$template_dir/"
          fi
          test -f "$template_dir/android_debug.apk"
          test -f "$template_dir/android_release.apk"

      - name: Export Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Mortofe/build/android
          ./godot --headless --path Mortofe --export-debug Android build/android/Mortofe.apk
          test -s Mortofe/build/android/Mortofe.apk
          sha256sum Mortofe/build/android/Mortofe.apk | tee Mortofe/build/android/Mortofe.apk.sha256
          ls -lh Mortofe/build/android/Mortofe.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Mortofe-Android-debug
          path: |
            Mortofe/build/android/Mortofe.apk
            Mortofe/build/android/Mortofe.apk.sha256
          if-no-files-found: error
          retention-days: 14
